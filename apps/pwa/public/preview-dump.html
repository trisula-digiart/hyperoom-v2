<!DOCTYPE html>
<html><head><title>dump</title></head><body>
<script>
setTimeout(() => {
  const items = document.querySelectorAll(".mobile-nav .mobile-nav-item");
  const labels = [...items].map(i => i.textContent.trim());
  const profile = document.querySelector(".mobile-profile-avatar");
  const navHtml = document.querySelector(".mobile-nav")?.innerHTML.slice(0, 400) || "NO NAV";
  document.body.innerHTML = "NAV ITEMS: " + labels.length + "<br>" +
    labels.join(" | ") + "<br>PROFILE IMG: " + (profile ? profile.getAttribute("src") : "TIDAK ADA") + "<br><pre>" + navHtml.replace(/</g, "&lt;") + "</pre>";
}, 6000);
</script>
</body></html>
